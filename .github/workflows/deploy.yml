name: Deploy

# Every change that reaches `main` goes live by itself. Vercel builds production from
# `backend-implementation`, so once CI on `main` is green this workflow (1) pushes any migration
# `main` adds to the hosted Supabase project, so the tables exist before the code that needs them,
# and (2) merges `main` into `backend-implementation` and pushes it. The merge commit is authored
# as the owner: Vercel's Hobby plan builds only commits by the account's own GitHub user, and a
# teammate's merge commit at the top of the branch would show as "Blocked" instead of building.
#
# Needs, once, in the repository's Settings → Secrets and variables → Actions:
#   SUPABASE_ACCESS_TOKEN   a personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD    the project's database password (Supabase → Connect → reset if lost)
# Without them a change that adds a migration is NOT deployed (the run fails and says so), so the
# site never runs ahead of its database; changes without migrations still deploy.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

# One deploy at a time, in order; a second merge waits for the first.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Migrations, then main → backend-implementation
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: fbbimuspcsytjhbqlzzc
      HAVE_SUPABASE_SECRETS: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_DB_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: What main adds to production
        id: diff
        run: |
          git fetch origin backend-implementation
          if git merge-base --is-ancestor origin/main origin/backend-implementation; then
            echo "Production already has everything on main; nothing to deploy."
            echo "nothing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          migrations=$(git diff --name-only --diff-filter=A origin/backend-implementation...origin/main -- supabase/migrations | tr '\n' ' ')
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"
          echo "New migrations: ${migrations:-none}"

      - name: Migrations need the Supabase secrets
        if: steps.diff.outputs.nothing != 'true' && steps.diff.outputs.migrations != '' && env.HAVE_SUPABASE_SECRETS != 'true'
        run: |
          echo "::error::main adds migrations (${{ steps.diff.outputs.migrations }}) but SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD aren't set as repository secrets, so they can't be pushed from here. Either add the secrets (see the comment at the top of .github/workflows/deploy.yml) and rerun this workflow, or run 'npx supabase db push' on main yourself and then rerun it."
          exit 1

      - uses: supabase/setup-cli@v1
        if: steps.diff.outputs.nothing != 'true' && steps.diff.outputs.migrations != ''
        with:
          version: latest

      - name: Push migrations to the hosted project
        if: steps.diff.outputs.nothing != 'true' && steps.diff.outputs.migrations != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push

      - name: Merge main into backend-implementation and push (Vercel builds it)
        if: steps.diff.outputs.nothing != 'true'
        run: |
          git config user.name "${{ vars.DEPLOY_AUTHOR_NAME || 'Sophia Huh' }}"
          git config user.email "${{ vars.DEPLOY_AUTHOR_EMAIL || 'sophiahuh@gmail.com' }}"
          git checkout -B backend-implementation origin/backend-implementation
          git merge --no-ff -m "Deploy: main at $(git rev-parse --short origin/main)" origin/main
          git push origin backend-implementation
          echo "Pushed $(git rev-parse --short HEAD); Vercel is building it."
